name: Daily Government Directory Check

on:
  schedule:
    # 03:00 UTC ~ 08:30 IST, daily
    - cron: '0 3 * * *'
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run the daily checker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update.py

      - name: Configure git identity
        run: |
          git config user.name "india-directory-bot"
          git config user.email "actions@users.noreply.github.com"

      # --- Leadership changes (CM/PM/ministers): low volatility, commit directly ---
      - name: Commit leadership updates directly to main
        run: |
          git add data/union-leadership.json data/telangana-leadership.json \
                   data/andhra-leadership.json data/karnataka-leadership.json \
                   data/last-run-summary.md
          if ! git diff --cached --quiet -- data/union-leadership.json data/telangana-leadership.json data/andhra-leadership.json data/karnataka-leadership.json; then
            git commit -m "chore: daily leadership check ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No leadership changes today."
            git reset
          fi

      # --- MLA changes (by-elections/deaths/defections): still human-reviewed via PR ---
      - name: Open a PR for MLA updates
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            data/telangana-mlas.json
            data/andhra-mlas.json
            data/karnataka-mlas.json
            data/uttar_pradesh-mlas.json
            data/maharashtra-mlas.json
            data/bihar-mlas.json
            data/tamil_nadu-mlas.json
            data/madhya_pradesh-mlas.json
            data/mps-uttar_pradesh.json
            data/mps-maharashtra.json
            data/last-run-summary.md
          commit-message: "chore: daily MLA check (needs review)"
          branch: auto/mla-updates
          delete-branch: true
          title: "MLA updates -- ${{ github.run_id }}"
          body-path: data/last-run-summary.md
          labels: automated,needs-review
